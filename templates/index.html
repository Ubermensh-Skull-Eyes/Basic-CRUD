{% extends 'base.html' %}

{% block head %}  
    <h1>Task Master</h1>
{% endblock head %}

{% block body %}
<div class="content">
    <table>
        <tr>
            <th>Task</th>
            <th>Added</th>
            <th>Actions</th>
        </tr>
        {% for task in tasks %}
        <tr>
            <td>{{ task.content}}</td>
            <td>{{task.date_time.date()}}</td>
            <td>
                <a href="/delete/{{task.id}}">Delete</a>
                <br>
                <a href="/update/{{task.id}}">Update</a>
            </td>

        </tr>
        {% endfor %}
    </table>
    <form action="/" method="post"> 
        <!-- <input type ="text" name="Message_id" id="content"/> -->
        <input type ="text" name="content" id="content"/>
        <input type ="submit" value="Add Task"/>
    </form>
</div>
{% endblock %}
